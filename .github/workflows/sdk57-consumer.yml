name: Expo SDK 57 consumer

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk57-consumer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packed-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate packed Expo SDK 57 consumer
        run: bun run validate:sdk57-consumer
